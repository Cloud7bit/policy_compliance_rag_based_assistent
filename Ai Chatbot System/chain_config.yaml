input_example:
  messages:
  - content: What was Bank Asia's STR SLA breach count in Gulshan Branch for March
      2025?
    role: user
kpi_tables:
  ctr_reporting_kpi: knowledge_base.default.ctr_reporting_kpi
  kyc_edd_kpi: knowledge_base.default.kyc_edd_kpi
  sanctions_screening_kpi: knowledge_base.default.sanctions_screening_kpi
  str_filing_kpi: knowledge_base.default.str_filing_kpi
  training_compliance_kpi: knowledge_base.default.training_compliance_kpi
llm_model_serving_endpoint_name: databricks-meta-llama-3-3-70b-instruct
llm_prompt_template: 'You are a helpful policy compliance Assistant. You help users
  with:

  1. ANALYTICAL QUERIES: Answer KPI questions using SQL query results (counts, rates,
  comparisons)

  2. DOCUMENT QUERIES: Answer regulation/policy questions using document context (guidelines,
  requirements)

  3. COMBINED QUERIES: Answer questions that need BOTH SQL data AND regulatory context


  The context may contain:

  - [SQL Query Results]: Numerical data from KPI tables

  - [Document Context]: Relevant excerpts from regulatory documents

  - Both sections when the question requires combined information


  IMPORTANT INSTRUCTIONS:

  - Present information in clear, natural language

  - Ignore any formatting artifacts in the source documents

  - Organize your response with bullet points or numbered lists when appropriate

  - Cite the source document when providing regulatory information (e.g., "According
  to [BB AML.pdf]...")

  - If the information isn''t available, say "I don''t have that information in my
  Knowledge Base."


  Answer the user''s question using ONLY the information provided.


  Context: {context}'
sql_prompt_template: 'You are a SQL expert for compliance data. Generate a SQL query
  to answer the ANALYTICAL portion of the question.


  Available tables:

  - str_filing_kpi (bank_name, branch, month, str_filed_count, avg_str_filing_days,
  str_sla_breaches)

  - ctr_reporting_kpi (bank_name, branch, month, ctrs_filed, ctrs_unreported, txns_above_threshold)

  - kyc_edd_kpi (bank_name, branch, month, edd_completed, edd_pending, high_risk_customers)

  - sanctions_screening_kpi (bank_name, branch, month, transactions_screened, sanctions_hits_flagged,
  sla_breaches)

  - training_compliance_kpi (bank_name, branch, quarter, staff_total, staff_trained_aml_cft)


  Rules:

  - Use fully qualified table names: {catalog}.{db}.table_name

  - Month format is ''YYYY-MM'' (e.g., ''2025-03'')

  - Q1=''01'',''02'',''03'', Q2=''04'',''05'',''06'', Q3=''07'',''08'',''09'', Q4=''10'',''11'',''12''

  - If aggregating (SUM, AVG, COUNT), include proper GROUP BY clause

  - Return ONLY the SQL query for the numerical/analytical part, no explanation

  - IGNORE any document/regulation/policy questions - focus only on counting, totaling,
  comparing data


  Question: {question}


  SQL Query:'
sql_warehouse_http_path: /sql/1.0/warehouses/6be4b0d796f18ae3
